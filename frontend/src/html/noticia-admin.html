<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gazeta Central - Admin Notícias</title>

        <!-- Estilos -->
        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/noticia-admin.css">
        <link rel="stylesheet" href="../css/footer.css">

        <!-- Favicon -->
        <link rel="shortcut icon" type="image/png" href="../img/favicon.png">

        <!-- Google Fonts: Inter (Sans-serif moderna) + Playfair Display (Serifada elegante para manchetes) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>

    <body>

        <!-- Scripts do Cabeçalho/Rodapé e do Leitor de Notícia -->
        <script type="module" src="../js/header.js"></script>
        <script type="module" src="../js/noticia-admin.js"></script>
        <script type="module" src="../js/footer.js"></script> 

        <!-- Cabeçalho Reutilizado -->
        <div id="header-container"></div>

        <!-- Conteúdo da Notícia Completa -->
        <main id="container-noticia-admin" class="flex flex-center">

            <section id="container-tabela-noticias">
                <h3>Notícias Cadastradas</h3>
                <br/>
                <table>
                    <thead>
                        <tr>
                            <th>Editoria</th>
                            <th>Chapéu</th>
                            <th>Título</th>
                            <th>Linha Fina</th>
                            <th>Autor</th>
                            <th>Conteúdo</th>
                            <th>Ações</th> <!-- Coluna para botões de ação (editar, excluir e etc) -->
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela-noticias">
                        <tr>
                            <td colspan="7" style="text-align: center;">Carregando notícias...</td>
                        </tr>
                    </tbody>
                </table>

                <!-- Paginação -->
                <div id="container-paginacao-noticias" class="paginacao-flex">
                    <button id="btn-pagina-anterior" disabled>&laquo; Anterior</button>
                    <span id="info-paginacao">Página 1 de 1</span>
                    <button id="btn-pagina-proxima" disabled>Próxima &raquo;</button>
                </div>
            </section>

        </main>

        <!-- Rodapé Reutilizado -->
        <div id="footer-container"></div>

    </body>

</html>
