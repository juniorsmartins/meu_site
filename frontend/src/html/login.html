<!DOCTYPE html>
<html lang="pt-BR">

    <!-- Cabeçalho do Documento (título, meta tags, links para estilos, fontes e scripts) -->
    <head>
        <meta charset="UTF-8"> 
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Gazeta Central</title>

        <!-- Estilos -->
        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/login.css">
        <link rel="stylesheet" href="../css/footer.css">

        <!-- Favicon -->
        <link rel="shortcut icon" type="image/png" href="../img/favicon.png">

        <!-- Google Fonts: Inter (Sans-serif moderna) + Playfair Display (Serifada elegante para manchetes) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>

    <!-- Corpo do Documento -->
    <body>

        <!-- JavaScript -->
        <script src="../js/header.js"></script>
        <script src="../js/footer.js"></script>

        <!-- Cabeçalho -->
        <div id="header-container"></div>


        <!-- Conteúdo da Página -->
        <section>

            <form action="#" method="post" onsubmit="login()" class="flex flex-center">
                <div class="form-itens">
                    <label for="email-login">Email:</label>
                    <input id="email-login" name="email-login" type="email" placeholder="Digite seu email" />
                </div>
                <div class="form-itens">
                    <label for="pass">Senha:</label>
                    <input id="pass" name="pass" type="password" placeholder="Digite sua senha" />
                </div>
                <button type="submit" class="btn-padrao">Login</button>
            </form>

        </section>


        <!-- Rodapé -->
        <div id="footer-container"></div>

    </body>
</html>
