<!DOCTYPE html>
<html lang="pt-BR">

    <!-- Cabeçalho do Documento (título, meta tags, links para estilos, fontes e scripts) -->
    <head>
        <meta charset="UTF-8"> 
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Gazeta Central</title>

        <!-- Estilos -->
        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/header.css">
        <link rel="stylesheet" href="../css/formulario.css">
        <link rel="stylesheet" href="../css/footer.css">

        <!-- Favicon -->
        <link rel="shortcut icon" type="image/png" href="../img/favicon.png">

        <!-- Google Fonts: Inter (Sans-serif moderna) + Playfair Display (Serifada elegante para manchetes) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>

    <!-- Corpo do Documento -->
    <body>

        <!-- JavaScript -->
        <script type="module" src="../js/header.js"></script>
        <script src="../js/footer.js"></script>
        <script src="../js/contato.js"></script>
        

        <!-- Cabeçalho -->
        <div id="header-container"></div>


        <!-- Conteúdo da Página -->
        <section>

            <form onsubmit="contato(event)" class="flex flex-center">
                <div>
                    <div class="form-itens">
                        <label for="nome">Nome:</label>
                        <input id="nome" name="nome" type="text" placeholder="Digite seu nome" required />
                    </div>
                    <div class="form-itens">
                        <label for="email">Email:</label>
                        <input id="email" name="email" type="email" placeholder="Digite seu email" required />
                    </div>
                </div>
                <div class="form-itens flex flex-center">
                    <label for="mensagem">Motivo do contato:</label>
                    <textarea id="mensagem" name="mensagem" rows="8" cols="50" placeholder="Digite sua mensagem" required ></textarea>
                </div>
                <button type="submit" class="btn-padrao">Enviar</button>
            </form>

        </section>


        <!-- Rodapé -->
        <div id="footer-container"></div>

    </body>
</html>
